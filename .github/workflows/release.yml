# Publishes a release: push a `v<version>` tag matching the versions in Cargo.toml and package.json.
# Required repository secrets:
#   CARGO_REGISTRY_TOKEN  crates.io API token (scope: publish-new, publish-update)
#   NPM_TOKEN             npm automation / granular token with publish rights
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  check-version:
    name: Tag matches package versions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else "mismatch" end')
          npm_version=$(jq -r .version package.json)
          echo "tag=$tag cargo=$cargo_version npm=$npm_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$npm_version" ]; then
            echo "::error::tag v$tag does not match Cargo ($cargo_version) / npm ($npm_version) versions"
            exit 1
          fi
          grep -q "^## $tag\$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $tag' section"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  crates:
    name: Publish crates
    needs: [ci, check-version]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: Publish npm package
    needs: [ci, check-version]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub release
    needs: [crates, npm, check-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag
