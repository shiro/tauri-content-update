# Publishes a release: push a `v<version>` tag matching the versions in Cargo.toml and package.json.
# Required repository secrets:
#   CARGO_REGISTRY_TOKEN  crates.io API token (scope: publish-new, publish-update)
#   NPM_TOKEN             npm automation / granular token with publish rights
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  check-version:
    name: Tag matches package versions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else "mismatch" end')
          npm_version=$(jq -r .version package.json)
          echo "tag=$tag cargo=$cargo_version npm=$npm_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$npm_version" ]; then
            echo "::error::tag v$tag does not match Cargo ($cargo_version) / npm ($npm_version) versions"
            exit 1
          fi
          grep -q "^## $tag\$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $tag' section"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  # crates.io and npm cannot publish atomically together. To avoid releasing one without the other, a
  # single job validates both tokens and both packages (dry runs) before uploading anything, then
  # publishes crates (more failure modes: verify build, crates.io limits) before npm (a tarball upload).
  # Every publish step skips versions already on the registry, so re-running a failed job completes a
  # partial release.
  publish:
    name: Publish crates and npm package
    needs: [ci, check-version]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tokens
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "::error::CARGO_REGISTRY_TOKEN is not set"; exit 1; }
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::NPM_TOKEN is not set"; exit 1; }
          # crates.io: an invalid token yields "authentication failed"; a valid one is accepted, or
          # rejected only because the endpoint is website-only.
          body=$(curl -sS -H "Authorization: $CARGO_REGISTRY_TOKEN" -H "User-Agent: ${GITHUB_REPOSITORY} release" \
            -w '\n%{http_code}' https://crates.io/api/v1/me)
          code=${body##*$'\n'}
          if [ "$code" != 200 ] && ! grep -q "crates.io website" <<<"$body"; then
            echo "::error::crates.io rejected CARGO_REGISTRY_TOKEN ($code)"; echo "$body"; exit 1
          fi
          echo "npm user: $(npm whoami)"

      - name: Find what is not published yet
        id: pending
        run: |
          crates=""
          for c in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: ${GITHUB_REPOSITORY} release" \
              "https://crates.io/api/v1/crates/$c/$VERSION")
            if [ "$code" = 200 ]; then echo "crate $c@$VERSION already published"; else crates="$crates -p $c"; fi
          done
          npm_name=$(jq -r .name package.json)
          if npm view "$npm_name@$VERSION" version >/dev/null 2>&1; then
            echo "npm $npm_name@$VERSION already published"; npm=false
          else npm=true; fi
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "npm=$npm" >> "$GITHUB_OUTPUT"

      - name: Dry run (crates)
        if: steps.pending.outputs.crates != ''
        run: cargo publish --locked --dry-run ${{ steps.pending.outputs.crates }}
      - name: Dry run (npm)
        if: steps.pending.outputs.npm == 'true'
        run: npm publish --dry-run --access public

      - name: Publish crates
        if: steps.pending.outputs.crates != ''
        run: cargo publish --locked ${{ steps.pending.outputs.crates }}
      - name: Publish npm package
        if: steps.pending.outputs.npm == 'true'
        run: npm publish --provenance --access public

  github-release:
    name: GitHub release
    needs: [publish, check-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag
