name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, package)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # the plugin crate links tauri, which needs WebKitGTK + GTK on Linux even for tests
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      # the build script regenerates permissions/autogenerated and permissions/schemas
      - name: Generated files are committed
        run: git diff --exit-code

      - name: Package crates (publish dry run)
        run: cargo publish --workspace --dry-run --locked

  js:
    name: JS (format, test, pack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm test

      - name: Pack npm package
        run: npm pack --dry-run

  # The example app (example/) consumes this repository's crates (path dependencies) and npm package
  # (`link:..`) the way an app would, and its e2e suites are the plugin's integration tests. A release
  # (release.yml runs this workflow) is only published if they pass.
  example-check:
    name: Example (format, typecheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            example/pnpm-lock.yaml

      # the linked package resolves @tauri-apps/api from the repository root
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: example
      - run: pnpm exec prettier --check .
        working-directory: example
      - run: pnpm typecheck
        working-directory: example

  example-desktop:
    name: Example e2e (chromium, linux desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # tauri (WebKitGTK + GTK), WebKitWebDriver (tauri-driver's backend) and xvfb-run (headless display)
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev pkg-config \
            webkit2gtk-driver xvfb

      # the toolchain of example/src-tauri/rust-toolchain.toml
      - name: Install Rust
        working-directory: example/src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example/src-tauri -> target

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            example/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: example

      - name: Install chromium
        working-directory: example
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      - run: pnpm e2e:chrome
        working-directory: example
      - run: pnpm e2e:desktop
        working-directory: example

      # the bindings the build generated from the app's commands match the committed ones
      - name: Generated files are committed
        run: git diff --exit-code

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: example-desktop-report
          path: |
            example/playwright-report/
            example/test-results/
          retention-days: 7

  example-android:
    name: Example e2e (android emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # the runner's preinstalled Android SDK is unused (the emulator SDK comes from nix), its space
      # is needed for the nix store
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android

      # example/shell.nix pins nixpkgs, so this is the same emulator, system image, avdmanager, NDK
      # and JDK as local runs
      - uses: cachix/install-nix-action@v31

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example/src-tauri -> target

      - name: Android e2e
        working-directory: example
        run: |
          nix-shell --run '
            set -e
            (cd .. && pnpm install --frozen-lockfile)
            pnpm install --frozen-lockfile
            pnpm e2e:android
          '

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: example-android-report
          path: |
            example/playwright-report/
            example/test-results/
            /tmp/**/emulator-*.log
          retention-days: 7
