[package]
name = "tauri-plugin-content-update-build"
description = "Build-time helper of tauri-plugin-content-update: hashes the native API an app provides and generates typed TypeScript bindings of its commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
proc-macro2 = "1"
quote = "1"
serde_json = "1"
sha2 = "0.11"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
# the same version/features tauri-build uses, so the app's build compiles it once
tauri-utils = { version = "2.10.4", features = ["build-2", "resources"] }
