[workspace]
members = [".", "build"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/shiro/tauri-content-update"
homepage = "https://github.com/shiro/tauri-content-update"
keywords = ["tauri", "tauri-plugin", "ota", "update", "live-update"]
categories = ["gui", "web-programming"]

[package]
name = "tauri-plugin-content-update"
description = "Over-the-air web content updates for Tauri 2 apps: per-file delta downloads, automatic rollback and native compatibility checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# required by tauri-plugin's build script (permissions)
links = "tauri-plugin-content-update"
# the npm package, the build helper crate and the example app
exclude = ["/node_modules", "/guest-js", "/lib", "/bin", "/build", "/example", "/package.json", "/pnpm-lock.yaml", "/.prettierignore", "/shell.nix", "/.github"]

[dependencies]
tauri = "2.12.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
ureq = "3.5"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-plugin = { version = "2.7.4", features = ["build"] }
